# Unified ZeroPaste releases (Android APK + Windows + Linux desktop).
#
# How to ship:
#   1. Bump version in apps/native/package.json and/or apps/desktop/package.json
#   2. Commit + push to main
#   3. CI creates android-vX.Y.Z / desktop-vX.Y.Z only for apps whose version changed
#
# Desktop releases build on Windows + Ubuntu and publish one tag with both installers:
#   ZeroPaste-desktop-vX.Y.Z-Setup.zip              (Windows)
#   ZeroPaste-desktop-vX.Y.Z-linux-x64-Setup.tar.gz (Linux)
#
# Android CI runs `bun run gen:argon2` after install so the Argon2 WebView bundle
# is always regenerated from the pinned hash-wasm package (no CDN at unlock).
#
# No manual git tags required. Re-pushing the same version is a no-op (tag exists).
#
# Required secrets:
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   ANDROID_KEYSTORE_BASE64   (base64 of zeropaste-release.keystore / PKCS12)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional:
#   EXPO_PUBLIC_SERVER_URL
#   NEXT_PUBLIC_SITE_URL / EXPO_PUBLIC_SITE_URL
#     (email confirm redirects; defaults to https://zeropaste.vercel.app)
#   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY
#     (desktop web UI; falls back to EXPO_PUBLIC_* if unset)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_android:
        description: "Force Android release even if version was not bumped"
        required: false
        type: boolean
        default: false
      force_desktop:
        description: "Force desktop release even if version was not bumped"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Detect version bumps
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.versions.outputs.android }}
      desktop: ${{ steps.versions.outputs.desktop }}
      android_version: ${{ steps.versions.outputs.android_version }}
      desktop_version: ${{ steps.versions.outputs.desktop_version }}
      android_tag: ${{ steps.versions.outputs.android_tag }}
      desktop_tag: ${{ steps.versions.outputs.desktop_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compare package.json versions
        id: versions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          FORCE_ANDROID: ${{ github.event_name == 'workflow_dispatch' && inputs.force_android == true }}
          FORCE_DESKTOP: ${{ github.event_name == 'workflow_dispatch' && inputs.force_desktop == true }}
        run: |
          set -euo pipefail

          before="${EVENT_BEFORE:-}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          # First commit / force-push placeholder
          if [ -z "${before:-}" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          read_version() {
            local path="$1"
            local ref="$2"
            if [ -n "$ref" ] && git cat-file -e "$ref:$path" 2>/dev/null; then
              git show "$ref:$path" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))"
            else
              echo ""
            fi
          }

          android_new="$(node -p "require('./apps/native/package.json').version")"
          desktop_new="$(node -p "require('./apps/desktop/package.json').version")"
          android_old="$(read_version apps/native/package.json "$before")"
          desktop_old="$(read_version apps/desktop/package.json "$before")"

          android_tag="android-v${android_new}"
          desktop_tag="desktop-v${desktop_new}"

          android=false
          desktop=false

          if [ "$FORCE_ANDROID" = "true" ]; then
            android=true
          elif [ -n "$android_new" ] && [ "$android_new" != "$android_old" ]; then
            android=true
          fi

          if [ "$FORCE_DESKTOP" = "true" ]; then
            desktop=true
          elif [ -n "$desktop_new" ] && [ "$desktop_new" != "$desktop_old" ]; then
            desktop=true
          fi

          # Skip if tag already exists (unless force_* is set)
          if [ "$android" = "true" ] && [ "$FORCE_ANDROID" != "true" ] \
            && git rev-parse -q --verify "refs/tags/${android_tag}" >/dev/null; then
            echo "Tag ${android_tag} already exists — skipping Android"
            android=false
          fi
          if [ "$desktop" = "true" ] && [ "$FORCE_DESKTOP" != "true" ] \
            && git rev-parse -q --verify "refs/tags/${desktop_tag}" >/dev/null; then
            echo "Tag ${desktop_tag} already exists — skipping desktop"
            desktop=false
          fi

          {
            echo "android=${android}"
            echo "desktop=${desktop}"
            echo "android_version=${android_new}"
            echo "desktop_version=${desktop_new}"
            echo "android_tag=${android_tag}"
            echo "desktop_tag=${desktop_tag}"
          } >> "$GITHUB_OUTPUT"

          echo "android: ${android_old:-<none>} → ${android_new} (release=${android}, tag=${android_tag})"
          echo "desktop: ${desktop_old:-<none>} → ${desktop_new} (release=${desktop}, tag=${desktop_tag})"

  android:
    name: Android ${{ needs.detect.outputs.android_tag }}
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SERVER_URL: ${{ secrets.EXPO_PUBLIC_SERVER_URL }}
      EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Inline hash-wasm into the Argon2 WebView bridge (no CDN at unlock time).
      - name: Generate Argon2 WASM bundle
        working-directory: apps/native
        run: bun run gen:argon2

      - name: Write apps/native/.env from secrets
        working-directory: apps/native
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_ANON_KEY secrets"
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}"
            echo "EXPO_PUBLIC_SITE_URL=${EXPO_PUBLIC_SITE_URL:-https://zeropaste.vercel.app}"
            if [ -n "${EXPO_PUBLIC_SERVER_URL:-}" ]; then
              echo "EXPO_PUBLIC_SERVER_URL=${EXPO_PUBLIC_SERVER_URL}"
            fi
          } > .env

      - name: Expo prebuild
        working-directory: apps/native
        run: |
          bunx expo prebuild --platform android
          bunx expo config --json --type public > /tmp/expo-config.json
          node -e "
            const cfg = require('/tmp/expo-config.json');
            const u = cfg.extra?.EXPO_PUBLIC_SUPABASE_URL || '';
            const k = cfg.extra?.EXPO_PUBLIC_SUPABASE_ANON_KEY || '';
            if (!u || !k) {
              console.error('Supabase env missing from expo config extra after prebuild');
              process.exit(1);
            }
            console.log('version=' + cfg.version + ' versionCode=' + cfg.android?.versionCode);
          "

      # Expo prebuild regenerates android/; pin enough heap for D8 mergeDexRelease.
      - name: Raise Gradle heap for release dex
        working-directory: apps/native/android
        run: |
          {
            echo ""
            echo "# CI: D8 mergeDexRelease OOMs on default ~2g heap"
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvm.options=-Xmx2g"
          } >> gradle.properties
          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Decode release keystore
        working-directory: apps/native/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret (publish keystore, base64-encoded)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > zeropaste-release.keystore
          # PKCS12/JKS are ZIP-like; reject empty/corrupt decode early
          python3 - <<'PY'
          from pathlib import Path
          p = Path("zeropaste-release.keystore")
          data = p.read_bytes()
          if len(data) < 64:
              raise SystemExit(f"keystore too small ({len(data)} bytes) — check ANDROID_KEYSTORE_BASE64")
          print(f"keystore ok: {len(data)} bytes")
          PY

      - name: Configure release signing
        working-directory: apps/native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bun run scripts/configure-android-release-signing.ts

      - name: Assemble release APK
        working-directory: apps/native/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        id: apk
        run: |
          APK=$(find apps/native/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            find apps/native/android/app/build/outputs -type f || true
            exit 1
          fi
          DEST="ZeroPaste-${{ needs.detect.outputs.android_tag }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

          # Fail if still signed with the Android debug cert
          CERTS=$(keytool -printcert -jarfile "$DEST" 2>/dev/null || true)
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is still signed with the debug key — release signing did not apply"
            exit 1
          fi
          if ! echo "$CERTS" | grep -qi "Owner:\|Signer #1\|Certificate fingerprints"; then
            echo "::warning::Could not print APK signing cert (keytool); continuing"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeropaste-android-${{ needs.detect.outputs.android_version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.android_tag }}
          name: ZeroPaste Android ${{ needs.detect.outputs.android_version }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-windows:
    name: Desktop Windows ${{ needs.detect.outputs.desktop_tag }}
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Write apps/web/.env from secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SERVER_URL: ${{ secrets.EXPO_PUBLIC_SERVER_URL }}
        run: |
          URL="${NEXT_PUBLIC_SUPABASE_URL:-$EXPO_PUBLIC_SUPABASE_URL}"
          KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-$EXPO_PUBLIC_SUPABASE_ANON_KEY}"
          {
            if [ -n "${URL:-}" ]; then
              echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
            fi
            if [ -n "${KEY:-}" ]; then
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${KEY}"
            fi
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://zeropaste.vercel.app}"
            if [ -n "${EXPO_PUBLIC_SERVER_URL:-}" ]; then
              echo "NEXT_PUBLIC_SERVER_URL=${EXPO_PUBLIC_SERVER_URL}"
            fi
          } > apps/web/.env
          echo "Wrote apps/web/.env (supabase=$([ -n "$URL" ] && echo yes || echo no))"

      - name: Build desktop (stable)
        run: bun run build:desktop

      - name: Locate installer zip
        id: zip
        shell: bash
        run: |
          ZIP=$(find apps/desktop/artifacts -name "*ZeroPaste-Setup.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No ZeroPaste-Setup.zip under apps/desktop/artifacts"
            find apps/desktop/artifacts -type f || true
            find apps/desktop/build -name "*.zip" || true
            exit 1
          fi
          DEST="ZeroPaste-${{ needs.detect.outputs.desktop_tag }}-Setup.zip"
          cp "$ZIP" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeropaste-desktop-windows-${{ needs.detect.outputs.desktop_version }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  desktop-linux:
    name: Desktop Linux ${{ needs.detect.outputs.desktop_tag }}
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Electrobun / GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            tar gzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Write apps/web/.env from secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SERVER_URL: ${{ secrets.EXPO_PUBLIC_SERVER_URL }}
        run: |
          URL="${NEXT_PUBLIC_SUPABASE_URL:-$EXPO_PUBLIC_SUPABASE_URL}"
          KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-$EXPO_PUBLIC_SUPABASE_ANON_KEY}"
          {
            if [ -n "${URL:-}" ]; then
              echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
            fi
            if [ -n "${KEY:-}" ]; then
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${KEY}"
            fi
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://zeropaste.vercel.app}"
            if [ -n "${EXPO_PUBLIC_SERVER_URL:-}" ]; then
              echo "NEXT_PUBLIC_SERVER_URL=${EXPO_PUBLIC_SERVER_URL}"
            fi
          } > apps/web/.env
          echo "Wrote apps/web/.env (supabase=$([ -n "$URL" ] && echo yes || echo no))"

      - name: Build desktop (stable)
        run: bun run build:desktop

      - name: Locate Linux installer archive
        id: tarball
        run: |
          TGZ=$(find apps/desktop/artifacts -name "*ZeroPaste-Setup.tar.gz" | head -n 1)
          if [ -z "$TGZ" ]; then
            echo "::error::No ZeroPaste-Setup.tar.gz under apps/desktop/artifacts"
            find apps/desktop/artifacts -type f || true
            find apps/desktop/build -name "*.tar.gz" || true
            exit 1
          fi
          DEST="ZeroPaste-${{ needs.detect.outputs.desktop_tag }}-linux-x64-Setup.tar.gz"
          cp "$TGZ" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeropaste-desktop-linux-${{ needs.detect.outputs.desktop_version }}
          path: ${{ steps.tarball.outputs.path }}
          if-no-files-found: error

  desktop-publish:
    name: Publish Desktop ${{ needs.detect.outputs.desktop_tag }}
    needs: [detect, desktop-windows, desktop-linux]
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: zeropaste-desktop-windows-${{ needs.detect.outputs.desktop_version }}
          path: dist

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: zeropaste-desktop-linux-${{ needs.detect.outputs.desktop_version }}
          path: dist

      - name: List release files
        run: ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.desktop_tag }}
          name: ZeroPaste Desktop ${{ needs.detect.outputs.desktop_version }}
          files: dist/*
          body: |
            ## Windows
            Download **`ZeroPaste-${{ needs.detect.outputs.desktop_tag }}-Setup.zip`**, unzip, then run **`Install ZeroPaste.exe`**.

            ## Linux (x64 / Ubuntu 22.04+)
            Download **`ZeroPaste-${{ needs.detect.outputs.desktop_tag }}-linux-x64-Setup.tar.gz`**, extract, then run **`./installer`**.

            The installer extracts to `~/.local/share/` and creates a desktop shortcut.
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
